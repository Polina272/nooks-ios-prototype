name: Publish clickable Nooks prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q nooks-ios-project.zip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: nooks-ios
        run: npm ci
      - name: Set public web path
        working-directory: nooks-ios
        run: node -e "const fs=require('fs'); const p='app.json'; const c=JSON.parse(fs.readFileSync(p)); c.expo.experiments={...(c.expo.experiments||{}),baseUrl:'/nooks-ios-prototype'}; fs.writeFileSync(p,JSON.stringify(c))"
      - name: Build web prototype
        working-directory: nooks-ios
        run: npx expo export --platform web --output-dir ../dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
